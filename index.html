<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ed">
<title>REP.FLOW — 거북이 분양·도감 플랫폼 (모바일 MVP)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
/* ── "Ink Archive" 토큰 — src/app/globals.css 이식 (컨셉C 기하학 × REP.FLOW 로고 색감) ── */
:root {
  --background: #f4f2ed;
  --foreground: #17150f;
  --brand: #17150f;
  --brand-dark: #0c0b08;
  --brand-darker: #070605;
  --brand-accent: #17150f;
  --brand-accent-dark: #2e2b22;
  --brand-tint-1: #3a362c;
  --brand-tint-2: #232017;
  --foam: #ece9e0;
  --surface: #ffffff;
  --muted: #6b675c;
  --line: #e4e0d6;
  --sand: #bfae8e;
  --sand-light: #cdbd97;
  --selected-ring: #ded6c2;
  --available: #0f5132;
  --reserved: #9a6b1a;
  --sold: #8a8170;
  --danger: #b91c1c;
  --shadow-bar: 0 10px 28px rgba(23, 21, 15, 0.06);
  --font-sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif;
  --font-display: "Plus Jakarta Sans", "Pretendard Variable", Pretendard, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --header-h: 56px;
  --bottomnav-h: 62px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--background);
  /* 플라스터 질감 — 로고 바탕의 회벽 느낌. 에셋 없이 CSS 한 겹 */
  background-image: repeating-linear-gradient(
    95deg,
    rgba(23, 21, 15, 0.012) 0 2px,
    transparent 2px 7px
  );
  color: var(--foreground);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overflow-wrap: anywhere;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  overflow-x: hidden;
}
::selection { background: var(--selected-ring); color: var(--foreground); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
img { display: block; }

.font-display { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.01em; }
.mono-label {
  font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
}
/* 다이아몬드 클립 — REP.FLOW 마크 모티프 */
.diamond-clip { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
@keyframes soft-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.rise { animation: soft-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
@media (prefers-reduced-motion: reduce) { .rise { animation: none; } }

/* ── 상단바 — REP.FLOW 락업 + 잉크 1.5px 보더 ── */
header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  height: var(--header-h); padding: 0 16px;
  background: rgba(244, 242, 237, 0.9); backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--foreground);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo .mark {
  display: flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; flex-shrink: 0;
  border: 1.6px solid var(--foreground); transform: rotate(45deg);
}
.logo .mark span {
  font-family: var(--font-display); font-weight: 800; font-size: 11px; line-height: 1;
  transform: rotate(-45deg);
}
.logo .word { font-family: var(--font-display); font-weight: 800; font-size: 0.875rem; letter-spacing: 0.24em; }
.header-actions { display: flex; gap: 4px; }
.icon-btn { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; color: var(--foreground); }
.icon-btn .badge {
  position: absolute; top: 4px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--brand-accent); color: var(--background);
  font-size: 0.5625rem; font-weight: 800; line-height: 16px; text-align: center;
}

/* ── 뷰 컨테이너 ── */
main { padding: 0 0 calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 24px); }
.view { display: none; }
.view.active { display: block; }

/* ── 정사각형 배너 — REP.FLOW 로고 (이미지 자체가 흰 배경의 900×900) ── */
.banner {
  position: relative; margin: 16px 16px 0; aspect-ratio: 4 / 3; overflow: hidden;
  border-radius: 12px; border: 1.5px solid var(--foreground); background: var(--surface);
}
.banner img { width: 100%; height: 100%; object-fit: cover; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ── 다이아몬드 카테고리 슬라이더 ── */
.hex-head { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 16px 4px; }
.hex-head .t { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; }
.hex-head .mono-label { color: var(--muted); }
.hex-scroll { position: relative; }
.hex-track-wrap { overflow-x: auto; overflow-y: hidden; padding: 8px 16px; scrollbar-width: none; }
.hex-track-wrap::-webkit-scrollbar { display: none; }
.hex-track { position: relative; height: 138px; }
.hex-item { position: absolute; width: 120px; height: 104px; filter: drop-shadow(0 4px 8px rgba(23,21,15,.18)); transition: transform .15s; }
.hex-item:active { transform: scale(1.05); }
.hex-item .lbl {
  pointer-events: none; position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.hex-item .lbl span { font-size: 0.7rem; font-weight: 800; line-height: 1; color: var(--background); }
.hex-fade { pointer-events: none; position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: linear-gradient(90deg, transparent, var(--background)); }

/* ── 섹션 ── */
section.block { margin-top: 32px; }
section.block.tight { margin-top: 12px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 16px 16px; }
.sec-head .mono-label { color: var(--muted); }
.sec-head h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin-top: 4px; letter-spacing: -0.01em; }
.sec-head .more { font-size: 0.875rem; font-weight: 600; color: var(--brand-accent); }

/* ── 매물 카드 — 사진/이름/판매자/가격 네 가지만, 보더 기반 ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
.card {
  position: relative; overflow: hidden; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line); transition: border-color .2s, transform .2s;
}
.card.power { border-color: rgba(23, 21, 15, .4); }
.card:active { border-color: var(--foreground); }
.card .wish {
  position: absolute; right: 10px; top: 10px; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 999px; font-size: 0.875rem;
  border: 1px solid var(--line); background: rgba(255,255,255,.9); color: var(--foreground);
}
.card .wish.on { background: var(--brand-accent); border-color: var(--brand-accent); color: var(--background); }
.card .ph { position: relative; aspect-ratio: 5 / 4; background: var(--foam); overflow: hidden; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; }
.card .ph .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.card .tags { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 52px); }
.tag-ad { border-radius: 999px; padding: 4px 10px; font-size: 0.6875rem; font-weight: 700; background: var(--brand-accent); color: var(--background); }
.tag-reserved { border-radius: 999px; padding: 4px 10px; font-size: 0.6875rem; font-weight: 700; border: 1px solid var(--foreground); background: rgba(244,242,237,.95); color: var(--reserved); }
.card .body { padding: 14px; }
.card .nm { font-size: 0.875rem; font-weight: 600; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .seller-line { margin-top: 4px; font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .price { margin-top: 8px; font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }

/* ── 상태 배지 (상세·홈 전용 — 카드에선 예약중 칩만) ── */
.status-badge { border-radius: 999px; padding: 4px 10px; font-size: 0.6875rem; font-weight: 700; color: #fff; }
.status-badge.available { background: var(--available); }
.status-badge.reserved { background: var(--reserved); }
.status-badge.sold { background: var(--sold); }

/* ── 커뮤니티(홈) — 가로 스냅 슬라이드, 각진 흰 카드 + 앞쪽 잉크·회색 교차 띠 ── */
.post-slider {
  display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
  padding: 0 16px 8px; scroll-snap-type: x mandatory; scrollbar-width: none;
}
.post-slider::-webkit-scrollbar { display: none; }
.post-card {
  position: relative; width: 240px; flex-shrink: 0; scroll-snap-align: start;
  display: flex; flex-direction: column;
  border: 1px solid var(--line); background: var(--surface); padding: 16px 16px 16px 20px;
}
.post-card .stripe { position: absolute; top: 0; bottom: 0; left: 0; width: 6px; }
.post-card .t { font-size: 0.875rem; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-card .b { margin-top: 8px; font-size: 0.75rem; line-height: 1.6; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-card .mono-label { margin-top: 12px; color: var(--muted); }

/* ── 커뮤니티(라운지) — 제목·메타 리스트 ── */
.post-list { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 16px; }
.post-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.post-row:last-child { border-bottom: 0; }
.post-row .t { font-size: 0.875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post-row .mono-label { flex-shrink: 0; color: var(--muted); }

/* ── 목록 화면 ── */
.page-head { padding: 24px 16px 0; }
.page-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.625rem; margin-top: 4px; }
.page-head .mono-label { color: var(--muted); }
.filter-chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px; scrollbar-width: none; }
.filter-chips::-webkit-scrollbar { display: none; }
.fchip {
  flex-shrink: 0; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); padding: 8px 14px; font-size: 0.8125rem; font-weight: 600; color: var(--muted);
  white-space: nowrap;
}
.fchip.on { background: var(--brand); border-color: var(--brand); color: var(--background); }
.list-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 12px; }
.list-toolbar .cnt { font-size: 0.8125rem; color: var(--muted); }
.list-toolbar select {
  font: inherit; font-size: 0.8125rem; font-weight: 600; color: var(--foreground);
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 8px;
}

/* ── 상세 화면 ── */
.back-row { padding: 16px; }
.back-row button { font-size: 0.875rem; color: var(--muted); }
.gallery-main { position: relative; aspect-ratio: 4 / 3; background: var(--foam); overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px 16px 0; }
.thumbs button { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 8px; opacity: .75; }
.thumbs button img { width: 100%; height: 100%; object-fit: cover; }
.thumbs button.on { opacity: 1; box-shadow: 0 0 0 2px var(--selected-ring); }
.detail-info { padding: 20px 16px 0; }
.detail-info .top-row { display: flex; align-items: center; justify-content: space-between; }
.detail-info .top-row .mono-label { color: var(--muted); }
.detail-info h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.25; margin-top: 12px; letter-spacing: -0.02em; }
.detail-info .seller-line { margin-top: 6px; font-size: 0.8125rem; color: var(--muted); }
.spec-table { margin-top: 20px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.spec-table .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 0.875rem; }
.spec-table .row:last-child { border-bottom: 0; }
.spec-table .row .k { color: var(--muted); flex-shrink: 0; }
.spec-table .row .v { font-weight: 600; text-align: right; }
.detail-desc { margin-top: 16px; font-size: 0.875rem; line-height: 1.7; color: var(--muted); }
.detail-price { margin-top: 24px; display: flex; align-items: baseline; gap: 8px; }
.detail-price .p { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; letter-spacing: -0.02em; }
.detail-price .mono-label { color: var(--muted); }
.detail-ctas { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 16px; }
.btn { display: block; border-radius: 999px; padding: 15px 20px; text-align: center; font-size: 0.9375rem; font-weight: 700; transition: background .15s; }
.btn-accent { background: var(--brand-accent); color: var(--background); }
.btn-accent:active { background: var(--brand-accent-dark); }
.detail-ctas .btn[disabled] { background: var(--foam); color: var(--muted); }
.detail-ctas .wish-lg {
  display: flex; align-items: center; justify-content: center; width: 54px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 1.125rem;
}
.detail-ctas .wish-lg.on { background: var(--brand-accent); border-color: var(--brand-accent); color: var(--background); }
.seller-card { margin: 24px 16px 0; border-radius: 12px; background: var(--surface); padding: 16px; border: 1px solid var(--line); }
.seller-card .row1 { display: flex; align-items: center; justify-content: space-between; }
.seller-card .nm { font-weight: 700; font-size: 0.9375rem; }
.seller-card .rate { font-weight: 600; font-size: 0.8125rem; color: var(--brand-accent-dark); }
.seller-card .loc { margin-top: 4px; font-size: 0.8125rem; color: var(--muted); }

/* ── 검색 ── */
.search-bar { display: flex; gap: 8px; padding: 16px; }
.search-bar input {
  flex: 1; font: inherit; font-size: 0.9375rem; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); padding: 13px 16px; color: var(--foreground); outline: none;
}
.search-bar input:focus { border-color: var(--foreground); }
.hot-keywords { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
.empty { padding: 56px 24px; text-align: center; }
.empty .t { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; }
.empty .d { margin-top: 8px; font-size: 0.8125rem; line-height: 1.6; color: var(--muted); }

/* ── 마이 ── */
.account-hero { margin: 16px; border-radius: 12px; background: var(--brand-darker); padding: 24px 20px; position: relative; overflow: hidden; }
.account-hero .diamonds { position: absolute; top: -12px; right: 12px; display: flex; gap: 8px; opacity: .7; }
.account-hero .diamonds span { width: 48px; height: 48px; }
.account-hero .mono-label { color: var(--sand-light); position: relative; }
.account-hero .t { color: var(--background); font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin-top: 10px; position: relative; }
.account-hero .d { color: rgba(244,242,237,.85); font-size: 0.8125rem; line-height: 1.6; margin-top: 8px; position: relative; }
.menu-list { margin: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.menu-list button { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 16px; font-size: 0.9375rem; font-weight: 600; border-bottom: 1px solid var(--line); text-align: left; }
.menu-list button:last-child { border-bottom: 0; }
.menu-list button .arr { color: var(--muted); }

/* ── 하단 탭 ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 50;
  width: 100%; max-width: 480px;
  background: rgba(255,255,255,.95); backdrop-filter: blur(8px);
  box-shadow: 0 -12px 32px rgba(23,21,15,.08);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav ul { display: flex; list-style: none; }
.bottom-nav li { flex: 1; }
.bottom-nav a {
  position: relative; display: flex; min-height: 62px; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  font-size: 0.6875rem; font-weight: 600; color: var(--muted);
}
.bottom-nav a.on { color: var(--brand-accent-dark); }
.bottom-nav a .ind { display: none; position: absolute; left: 50%; top: 6px; width: 6px; height: 6px; transform: translateX(-50%); background: var(--sand); }
.bottom-nav a.on .ind { display: block; }

/* ── 토스트 ── */
#toast {
  position: fixed; bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 16px);
  left: 50%; transform: translateX(-50%) translateY(8px); z-index: 60;
  max-width: calc(100% - 48px); border-radius: 999px;
  background: var(--brand-darker); color: var(--background); padding: 11px 20px;
  font-size: 0.8125rem; font-weight: 600; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  box-shadow: 0 16px 40px rgba(23, 21, 15, 0.16);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <a href="#/" class="logo" aria-label="렙플로우 — 거북이 분양·도감 플랫폼 홈">
    <span class="mark" aria-hidden="true"><span>R</span></span>
    <span class="word">REP.FLOW</span>
  </a>
  <div class="header-actions">
    <a href="#/search" class="icon-btn" aria-label="검색">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.5-4.5"/></svg>
    </a>
    <button class="icon-btn" id="cart-btn" aria-label="장바구니">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.4 11.4a1.6 1.6 0 0 0 1.6 1.3h8.5a1.6 1.6 0 0 0 1.6-1.2L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
      <span class="badge" id="cart-badge" hidden>0</span>
    </button>
  </div>
</header>

<main>
  <div id="view-home" class="view"></div>
  <div id="view-listings" class="view"></div>
  <div id="view-detail" class="view"></div>
  <div id="view-search" class="view"></div>
  <div id="view-board" class="view"></div>
  <div id="view-account" class="view"></div>
</main>

<nav class="bottom-nav" aria-label="하단 탭">
  <ul>
    <li><a href="#/" data-tab="home"><span class="ind diamond-clip"></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>홈</a></li>
    <li><a href="#/listings" data-tab="listings"><span class="ind diamond-clip"></span>

    <div class="gallery-main"><img src="${l.photos[idx]}" alt="${l.name}"></div>
    ${l.photos.length > 1 ? `<div class="thumbs">${l.photos.map((p, i) =>
      `<button class="${i === idx ? "on" : ""}" data-photo="${i}" aria-label="사진 ${i + 1}번"><img src="${p}" alt=""></button>`).join("")}</div>` : ""}
    <div class="detail-info">
      <div class="top-row"><span class="mono-label">No. ${catalogNo(l.id)}</span>${statusBadge(l)}</div>
      <h2>${l.name}</h2>
      <p class="seller-line">${s.name} · ${s.location}</p>
      <div class="spec-table">
        <div class="row"><span class="k">종</span><span class="v">${l.species}</span></div>
        <div class="row"><span class="k">모프</span><span class="v">${l.morph}</span></div>
        <div class="row"><span class="k">성별</span><span class="v">${SEX[l.sex]}</span></div>
        <div class="row"><span class="k">크기</span><span class="v">${SIZE[l.sizeClass]} · 등갑 ${l.scl}cm</span></div>
        <div class="row"><span class="k">혈통</span><span class="v">${l.lineage}</span></div>
      </div>
      <p class="detail-desc">${l.desc}</p>
      <div class="detail-price"><span class="p">${fmtPrice(l.price)}</span><span class="mono-label">상담 예약가</span></div>
      <div class="detail-ctas">
        <button class="btn btn-accent" data-cart="${l.id}" ${l.status === "sold" || inCart ? "disabled" : ""}>${ctaLabel}</button>
        <button class="wish-lg${wished ? " on" : ""}" data-wish="${l.id}" aria-label="위시리스트">${wished ? "♥" : "♡"}</button>
      </div>
    </div>
    <div class="seller-card">
      <div class="row1"><span class="nm">${s.name}</span><span class="rate">★ ${s.rating.toFixed(1)}</span></div>
      <p class="loc">${s.location} · 브리더 직접 분양</p>
    </div>
  </div>`;
}

function renderSearch() {
  const q = state.query.trim();
  const results = q
    ? publicListings().filter((l) => (l.name + l.species + l.morph).includes(q))
    : [];
  document.getElementById("view-search").innerHTML = `
  <div class="rise">
    <div class="search-bar"><input id="search-input" type="search" placeholder="종 · 모프 · 개체명 검색" value="${q.replace(/"/g, "&quot;")}" enterkeyhint="search"></div>
    <div class="hot-keywords">${["펄", "베이비", "하이포", "비단거북"].map((k) => `<button class="fchip" data-keyword="${k}">${k}</button>`).join("")}</div>
    ${q === "" ? `<div class="empty"><p class="t">무엇을 찾으세요?</p><p class="d">종 이름이나 모프, 개체명으로 검색해보세요.</p></div>`
      : results.length ? `<div class="list-toolbar" style="padding-top:8px"><span class="cnt">"${q}" 결과 ${results.length}개체</span></div><div class="grid2">${results.map(cardHTML).join("")}</div>`
      : `<div class="empty"><p class="t">"${q}" 검색 결과가 없습니다</p><p class="d">다른 키워드로 다시 검색해보세요.</p></div>`}
  </div>`;
  const input = document.getElementById("search-input");
  input.addEventListener("input", () => {
    state.query = input.value;
    clearTimeout(input._t);
    input._t = setTimeout(() => { renderSearch(); document.getElementById("search-input").focus(); }, 350);
  });
}

function renderBoard() {
  document.getElementById("view-board").innerHTML = `
  <div class="rise">
    <div class="page-head"><p class="mono-label">Lounge</p><h2>라운지</h2></div>
    <div class="post-list" style="margin-top:16px">${POSTS.map((p) => `
      <a class="post-row" href="#/board" style="flex-direction:column;align-items:stretch;gap:6px">
        <p class="t" style="white-space:normal">${p.title}</p>
        <p style="font-size:.8125rem;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${p.body}</p>
        <span class="mono-label" style="color:var(--muted)">${p.date} · 댓글 ${p.comments} · ♥ ${p.likes}</span>
      </a>`).join("")}</div>
  </div>`;
}

function renderAccount() {
  document.getElementById("view-account").innerHTML = `
  <div class="rise">
    <div class="account-hero">
      <div class="diamonds" aria-hidden="true"><span class="diamond-clip" style="background:var(--brand-tint-1)"></span><span class="diamond-clip" style="background:var(--sand);opacity:.5;margin-top:24px"></span></div>
      <p class="mono-label">Guest</p>
      <p class="t">로그인 없이 둘러보는 중</p>
      <p class="d">프로토타입에서는 회원 기능이 모의로 동작합니다.<br>위시리스트 ${state.wishlist.size}개 · 장바구니 ${state.cart.size}개</p>
    </div>
    <div class="menu-list">
      ${["주문 내역", "위시리스트", "판매자 입점 안내", "공지사항"].map((m) => `<button data-menu="${m}"><span>${m}</span><span class="arr">›</span></button>`).join("")}
    </div>
  </div>`;
}

/* ════ 라우터 ════ */
const VIEWS = ["home", "listings", "detail", "search", "board", "account"];
function route() {
  const hash = location.hash || "#/";
  let view = "home", tab = "home";
  const detail = hash.match(/^#\/listings\/(\w+)/);
  if (detail) { view = "detail"; tab = "listings"; state.photoIdx = 0; renderDetail(detail[1]); }
  else if (hash.startsWith("#/listings")) {
    view = tab = "listings";
    const sp = hash.match(/species=([^&]+)/);
    state.species = sp ? decodeURIComponent(sp[1]) : null;
    renderListings();
  }
  else if (hash.startsWith("#/search")) { view = tab = "search"; renderSearch(); }
  else if (hash.startsWith("#/board")) { view = tab = "board"; renderBoard(); }
  else if (hash.startsWith("#/account")) { view = tab = "account"; renderAccount(); }
  else { renderHome(); }
  VIEWS.forEach((v) => document.getElementById("view-" + v).classList.toggle("active", v === view));
  document.querySelectorAll(".bottom-nav a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ════ 이벤트 (위임) ════ */
function updateCartBadge() {
  const b = document.getElementById("cart-badge");
  b.hidden = state.cart.size === 0;
  b.textContent = state.cart.size;
}
document.addEventListener("click", (e) => {
  const wishBtn = e.target.closest("[data-wish]");
  if (wishBtn) {
    e.preventDefault();
    const id = wishBtn.dataset.wish;
    const on = state.wishlist.has(id);
    if (on) state.wishlist.delete(id); else state.wishlist.add(id);
    document.querySelectorAll(`[data-wish="${id}"]`).forEach((b) => {
      b.classList.toggle("on", !on);
      b.textContent = on ? "♡" : "♥";
    });
    toast(on ? "위시리스트에서 제거했습니다" : "위시리스트에 추가했습니다");
    return;
  }
  const cartBtn = e.target.closest("[data-cart]");
  if (cartBtn && !cartBtn.disabled) {
    const id = cartBtn.dataset.cart;
    const l = LISTINGS.find((x) => x.id === id);
    if (l.status === "reserved") { toast("대기 문의를 남겼습니다 — 순서가 되면 알려드려요"); return; }
    state.cart.add(id);
    updateCartBadge();
    cartBtn.disabled = true;
    cartBtn.textContent = "장바구니에 담김";
    toast("장바구니에 담았습니다");
    return;
  }
  if (e.target.closest("[data-back]")) { location.hash = "#/listings"; return; }
  const chip = e.target.closest("[data-species]");
  if (chip) {
    const name = chip.dataset.species;
    location.hash = name ? "#/listings?species=" + encodeURIComponent(name) : "#/listings";
    return;
  }
  const kw = e.target.closest("[data-keyword]");
  if (kw) { state.query = kw.dataset.keyword; renderSearch(); return; }
  const photo = e.target.closest("[data-photo]");
  if (photo) {
    state.photoIdx = Number(photo.dataset.photo);
    const detail = location.hash.match(/^#\/listings\/(\w+)/);
    if (detail) renderDetail(detail[1]);
    return;
  }
  const menu = e.target.closest("[data-menu]");
  if (menu) { toast(`'${menu.dataset.menu}'은(는) 프로토타입에서 준비 중입니다`); return; }
  if (e.target.closest("#cart-btn")) {
    toast(state.cart.size ? `장바구니에 ${state.cart.size}개체가 담겨 있습니다` : "장바구니가 비어 있습니다");
  }
});

route();
</script>
</body>
</html>
